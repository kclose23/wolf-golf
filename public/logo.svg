<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballSheen" cx="38%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f1f5f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="1"/>
    </radialGradient>
    <filter id="pad-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="flag-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4ade80" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background: dark rounded square (iOS-style app icon) -->
  <rect width="512" height="512" rx="90" fill="#111827"/>
  <!-- Green glow from bottom -->
  <rect width="512" height="512" rx="90" fill="url(#bgGlow)"/>

  <!-- ═══════════════════════════════ -->
  <!-- WOLF TOE PADS (4 pads in arc)  -->
  <!-- ═══════════════════════════════ -->

  <!-- Left outer toe -->
  <ellipse cx="132" cy="192" rx="34" ry="50"
           fill="#f1f5f9" transform="rotate(-22 132 192)"
           filter="url(#pad-shadow)"/>

  <!-- Left inner toe -->
  <ellipse cx="206" cy="152" rx="38" ry="55"
           fill="#f1f5f9" transform="rotate(-6 206 152)"
           filter="url(#pad-shadow)"/>

  <!-- Right inner toe -->
  <ellipse cx="306" cy="152" rx="38" ry="55"
           fill="#f1f5f9" transform="rotate(6 306 152)"
           filter="url(#pad-shadow)"/>

  <!-- Right outer toe -->
  <ellipse cx="380" cy="192" rx="34" ry="50"
           fill="#f1f5f9" transform="rotate(22 380 192)"
           filter="url(#pad-shadow)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MAIN PAD: golf ball (large center pad)     -->
  <!-- ═══════════════════════════════════════════ -->

  <circle cx="256" cy="356" r="122" fill="url(#ballSheen)" filter="url(#pad-shadow)"/>

  <!-- Golf ball dimple pattern (hexagonal rows) -->
  <!-- Row 1 -->
  <circle cx="228" cy="272" r="5.5" fill="#cbd5e1"/>
  <circle cx="256" cy="262" r="5.5" fill="#cbd5e1"/>
  <circle cx="284" cy="272" r="5.5" fill="#cbd5e1"/>
  <!-- Row 2 -->
  <circle cx="208" cy="298" r="5.5" fill="#cbd5e1"/>
  <circle cx="234" cy="284" r="5.5" fill="#cbd5e1"/>
  <circle cx="260" cy="278" r="5.5" fill="#cbd5e1"/>
  <circle cx="286" cy="284" r="5.5" fill="#cbd5e1"/>
  <circle cx="310" cy="297" r="5.5" fill="#cbd5e1"/>
  <!-- Row 3 -->
  <circle cx="200" cy="326" r="5.5" fill="#cbd5e1"/>
  <circle cx="224" cy="310" r="5.5" fill="#cbd5e1"/>
  <circle cx="248" cy="302" r="5.5" fill="#cbd5e1"/>
  <circle cx="274" cy="302" r="5.5" fill="#cbd5e1"/>
  <circle cx="298" cy="310" r="5.5" fill="#cbd5e1"/>
  <circle cx="320" cy="325" r="5.5" fill="#cbd5e1"/>
  <!-- Row 4 -->
  <circle cx="199" cy="356" r="5.5" fill="#cbd5e1"/>
  <circle cx="223" cy="339" r="5.5" fill="#cbd5e1"/>
  <circle cx="247" cy="331" r="5.5" fill="#cbd5e1"/>
  <circle cx="273" cy="331" r="5.5" fill="#cbd5e1"/>
  <circle cx="297" cy="339" r="5.5" fill="#cbd5e1"/>
  <circle cx="321" cy="356" r="5.5" fill="#cbd5e1"/>
  <!-- Row 5 -->
  <circle cx="207" cy="382" r="5.5" fill="#cbd5e1"/>
  <circle cx="231" cy="366" r="5.5" fill="#cbd5e1"/>
  <circle cx="256" cy="360" r="5.5" fill="#cbd5e1"/>
  <circle cx="281" cy="366" r="5.5" fill="#cbd5e1"/>
  <circle cx="305" cy="381" r="5.5" fill="#cbd5e1"/>
  <!-- Row 6 -->
  <circle cx="230" cy="404" r="5.5" fill="#cbd5e1"/>
  <circle cx="256" cy="396" r="5.5" fill="#cbd5e1"/>
  <circle cx="282" cy="404" r="5.5" fill="#cbd5e1"/>
  <!-- Row 7 -->
  <circle cx="252" cy="427" r="5.5" fill="#cbd5e1"/>
  <circle cx="268" cy="427" r="5.5" fill="#cbd5e1"/>

  <!-- ════════════════════════════════ -->
  <!-- GOLF FLAG PIN (top-right area)  -->
  <!-- ════════════════════════════════ -->

  <!-- Pole -->
  <line x1="434" y1="52" x2="434" y2="168"
        stroke="#4ade80" stroke-width="7" stroke-linecap="round"
        filter="url(#flag-glow)"/>
  <!-- Triangular flag -->
  <path d="M 434,52 L 434,112 L 382,82 Z" fill="#16a34a"/>
  <!-- Flag highlight sheen -->
  <path d="M 434,56 L 434,88 L 410,74 Z" fill="#4ade80" opacity="0.35"/>
  <!-- Ground hole at pole base -->
  <ellipse cx="434" cy="172" rx="14" ry="5.5" fill="#0f172a" opacity="0.45"/>
</svg>
